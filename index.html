<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BookMyTable - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .center-intro {
            text-align: center;
        }
        form {
            margin: auto;
            text-align: left;
        }
        .submit-center {
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>BookMyTable</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Login</a></li>
            <li><a href="reserve.html">Reserve Table</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="checkout.html">Checkout</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <div class="center-intro">
                <h2>Get Started</h2>
                <p>Sign in with your details to reserve a table or order food.</p>
            </div>

            <form id="loginForm" novalidate>
                <fieldset>
                    <legend>Continue with Email or Mobile (+91)</legend>
                    <p>
                        <label for="email">Email Address:</label>
                        <input type="text" id="email" name="email" placeholder="Enter your email" onfocus="highlightField(this)" onblur="resetField(this)">
                        <small class="error-message"></small>
                    </p>
                    <p>
                        <label for="phone">Mobile Number (+91):</label>
                        <input type="text" id="phone" name="phone" placeholder="Enter 10-digit mobile number" onfocus="highlightField(this)" onblur="resetField(this)">
                        <small class="error-message"></small>
                    </p>
                    <p>
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" placeholder="Enter password (min 6 chars)" onfocus="highlightField(this)" onblur="resetField(this)">
                        <small class="error-message"></small>
                    </p>
                    <p>
                        <input type="checkbox" id="agree" name="agree">
                        <label for="agree">By continuing, you agree to our Terms & Conditions and Privacy Policy</label>
                        <small class="error-message"></small>
                    </p>
                    <div class="submit-center">
                        <input type="submit" value="Continue to Reserve Table">
                    </div>
                </fieldset>
            </form>

            <div class="summary-box center-text">
                <a href="reserve.html" class="btn">Go to Reserve Table</a>
                <a href="menu.html" class="btn">Go to Menu</a>
                <a href="checkout.html" class="btn">Go to Checkout</a>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 BookMyTable. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
